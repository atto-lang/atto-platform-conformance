name: Singleton shared-state v1 contract
on:
  pull_request:
    paths:
      - contracts/singleton-shared-state-v1.json
      - evidence/singleton-shared-state-v1.json
      - verification/verify-singleton-shared-state-v1.mjs
      - .github/workflows/singleton-shared-state-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet HEAD
      - name: Verify fail-closed five-backend contract
        run: node verification/verify-singleton-shared-state-v1.mjs
