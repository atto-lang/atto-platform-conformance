name: Platform readiness unit tests (SOURCE-FREE, NON-PROMOTING)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisory-readiness-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject foreign or unrecognized workflow sources before checkout
        run: |
          python3 - <<'PY'
          import json, os, sys
          name = os.environ.get("GITHUB_EVENT_NAME", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          event_path = os.environ.get("GITHUB_EVENT_PATH", "")
          if not event_path:
              sys.exit("MISSING_GITHUB_EVENT_PATH")
          try:
              with open(event_path, encoding="utf-8") as f:
                  payload = json.load(f)
          except (OSError, ValueError):
              sys.exit("INVALID_GITHUB_EVENT_PAYLOAD")
          if not isinstance(payload, dict):
              sys.exit("INVALID_GITHUB_EVENT_PAYLOAD")
          base = payload.get("repository") or {}
          if base.get("full_name") != repository or repository != "atto-lang/atto-platform-conformance":
              sys.exit("UNTRUSTED_WORKFLOW_BASE")
          if type(base.get("id")) is not int or base.get("id") != 1448719136:
              sys.exit("UNTRUSTED_IMMUTABLE_REPOSITORY_ID")
          if name == "pull_request":
              head = ((payload.get("pull_request") or {}).get("head") or {}).get("repo") or {}
              if (head.get("full_name") != repository or
                      type(head.get("id")) is not int or head.get("id") != 1448719136):
                  sys.exit("FOREIGN_PULL_REQUEST_HEAD_DENIED")
          elif name != "workflow_dispatch":
              sys.exit("UNSUPPORTED_WORKFLOW_EVENT")
          print("SOURCE_OWNER_ONLY=true")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact checked-out commit without running Git filters
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Execute source-free offline gate regression tests
        run: python3 -m unittest discover -v -s tools/platform_readiness -p 'test_*.py'
      - name: Clarify evidence boundary
        run: |
          echo "SOURCE_FREE_REFERENCE_ONLY=true"
          echo "MERGE_RELEASE_OR_PRIVATE_SOURCE_EXPORT=NOT_AUTHORIZED"
