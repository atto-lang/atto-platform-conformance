name: Platform readiness unit tests (SOURCE-FREE, NON-PROMOTING)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisory-readiness-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject foreign or unrecognized workflow sources before checkout
        env:
          GH_${{ github.event_path }}: EVENT_PATH
          GH_${{ github.event_name }}: EVENT_NAME
          GH_${{ github.repository }}: REPOSITORY
        run: |
          python3 - <<'PY'
          import json, os, sys
          name = os.environ["GH_EVENT_NAME"]
          repository = os.environ["GH_REPOSITORY"]
          with open(os.environ["GH_EVENT_PATH"], encoding="utf-8") as f:
              payload = json.load(f)
          base = payload.get("repository") or {}
          if base.get("full_name") != repository or repository != "ores-truffle-oreslang/oreslang-platform-conformance":
              sys.exit("UNTRUSTED_WORKFLOW_BASE")
          if name == "pull_request":
              head = ((payload.get("pull_request") or {}).get("head") or {}).get("repo") or {}
              if head.get("full_name") != repository or head.get("id") != base.get("id"):
                  sys.exit("FOREIGN_PULL_REQUEST_HEAD_DENIED")
          elif name != "workflow_dispatch":
              sys.exit("UNSUPPORTED_WORKFLOW_EVENT")
          print("SOURCE_OWNER_ONLY=true")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute source-free offline gate regression tests
        run: python3 -m unittest discover -v -s tools/platform_readiness -p test_readiness_gate.py
      - name: Clarify evidence boundary
        run: |
          echo "SOURCE_FREE_REFERENCE_ONLY=true"
          echo "MERGE_RELEASE_OR_PRIVATE_SOURCE_EXPORT=NOT_AUTHORIZED"
