name: Guarded ADT fixture integrity (host-only)
on:
  pull_request:
    paths:
      - 'contracts/aot-adt-guarded-guest-v1.json'
      - 'docs/aot-adt-guarded-guest-v1.md'
      - 'fixtures/aot-adt/**'
      - 'tests/test_aot_adt_guarded_guest.py'
      - 'bin/verify_aot_adt_guest_receipt.py'
      - '.github/workflows/aot-adt-guarded-guest.yml'
  push:
    paths:
      - 'contracts/aot-adt-guarded-guest-v1.json'
      - 'docs/aot-adt-guarded-guest-v1.md'
      - 'fixtures/aot-adt/**'
      - 'tests/test_aot_adt_guarded_guest.py'
      - 'bin/verify_aot_adt_guest_receipt.py'
      - '.github/workflows/aot-adt-guarded-guest.yml'
permissions:
  contents: read
jobs:
  source-integrity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify fixture Git blobs, exact expectations and fail-closed receipts
        run: |
          python3 --version
          python3 -m unittest discover -s tests -p 'test_aot_adt_guarded_guest.py' -v
      - name: Scope
        run: echo 'HOST_ONLY; no native AOT compiler or Atto guest executed'
