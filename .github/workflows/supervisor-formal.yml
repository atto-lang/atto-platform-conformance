name: Supervisor lifecycle formal verification
on:
  push:
    paths:
      - 'formal/supervision/**'
      - 'test/supervisor-lifecycle.test.mjs'
      - 'test/restart-refinement-contract.test.mjs'
      - 'bin/compare-supervisor-restart-traces.mjs'
      - 'fixtures/supervision/v1/verified-restart-trace.json'
      - '.github/workflows/supervisor-formal.yml'
      - 'bin/verify-supervisor-trace.mjs'
      - 'test/supervisor-trace.test.mjs'
  pull_request:
    paths:
      - 'formal/supervision/**'
      - 'test/supervisor-lifecycle.test.mjs'
      - 'test/restart-refinement-contract.test.mjs'
      - 'bin/compare-supervisor-restart-traces.mjs'
      - 'fixtures/supervision/v1/verified-restart-trace.json'
      - '.github/workflows/supervisor-formal.yml'
      - 'bin/verify-supervisor-trace.mjs'
      - 'test/supervisor-trace.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supervisor-trace-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run bounded explorer and negative trace mutation gates
        run: node --test test/supervisor-lifecycle.test.mjs test/supervisor-trace.test.mjs
  tlc-safety-and-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Bounded explorer and strict runtime-trace comparator self-tests
        run: node --test test/supervisor-lifecycle.test.mjs test/restart-refinement-contract.test.mjs
      - name: Exhaustive TLC state exploration and mutation counterexamples
        run: bash formal/supervision/check-tlc.sh
