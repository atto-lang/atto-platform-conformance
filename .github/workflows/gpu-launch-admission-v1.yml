name: GPU G0 launch schema adversarial tests (host-only)
on:
  pull_request:
    paths:
      - 'src/gpu-launch-admission-v1.mjs'
      - 'tests/gpu-launch-admission-v1*.test.mjs'
      - '.github/workflows/gpu-launch-admission-v1.yml'
  push:
    paths:
      - 'src/gpu-launch-admission-v1.mjs'
      - 'tests/gpu-launch-admission-v1*.test.mjs'
      - '.github/workflows/gpu-launch-admission-v1.yml'
permissions:
  contents: read
jobs:
  gpu-launch-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm original source head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Execute host-only GPU admission and boundary tests
        run: node --test tests/gpu-launch-admission-v1.test.mjs tests/gpu-launch-admission-v1-boundaries.test.mjs
