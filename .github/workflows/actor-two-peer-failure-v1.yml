name: Actor two-peer failure canonical SOURCE-ONLY integrity

on:
  pull_request:
    paths:
      - 'fixtures/actor-two-peer-failure-v1/**'
      - 'tests/actor-two-peer-failure-v1.test.mjs'
      - 'docs/ACTOR_TWO_PEER_FAILURE_PARITY_V1.md'
      - '.github/workflows/actor-two-peer-failure-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract-only-not-guest-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR HEAD and canonical source blob
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git hash-object fixtures/actor-two-peer-failure-v1/two-peer-failure-matrix.atto)" = 003983eb9475d7fd680ea5b31804df02f1843f19
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Assert pending-only six-case contract and mutation denials
        run: node --test tests/actor-two-peer-failure-v1.test.mjs
      - name: State exact evidence ceiling
        run: |
          echo "ACTOR_TWO_PEER_SOURCE_CONTRACT_ONLY|GUEST=NOT_EXECUTED|NATIVE_AOT=NOT_EXECUTED"
