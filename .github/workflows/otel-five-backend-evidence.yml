name: OTel five-backend evidence gate (source-free only)
on:
  pull_request:
    paths:
      - 'contracts/otel-five-backend-v1.json'
      - 'bin/verify-otel-guest-parity.mjs'
      - 'tests/otel-five-backend-evidence.test.mjs'
      - 'bin/run-otel-guest-execution.mjs'
      - 'tests/otel-real-guest-config.test.mjs'
      - 'tests/otel-canonical-contract.test.mjs'
      - 'bin/verify-otel-contract.mjs'
      - 'docs/OTEL_FIVE_BACKEND_EVIDENCE.md'
      - '.github/workflows/otel-five-backend-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-false-guest-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert real source SHA and clean exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Pin supported Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Execute six-profile oracle and malicious receipt regressions
        run: node --test tests/otel-five-backend-evidence.test.mjs tests/otel-real-guest-config.test.mjs tests/otel-canonical-contract.test.mjs
      - name: Fail closed on canonical source-only contract promotion
        run: |
          node bin/verify-otel-contract.mjs > "$RUNNER_TEMP/otel-contract.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/otel-contract.json','utf8'));
          assert.equal(result.classification,'SOURCE_ONLY_CANDIDATE');
          assert.equal(result.guestExecuted,false);
          assert.equal(result.releaseCertified,false);
          assert.equal(result.profiles,6);
          assert.equal(result.backends,5);
          NODE
