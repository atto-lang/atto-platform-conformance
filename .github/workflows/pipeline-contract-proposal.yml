name: Typed pipeline proposal contract and TLC
on:
  push:
    paths:
      - 'src/pipeline-contract.mjs'
      - 'contracts/pipeline/**'
      - 'tests/pipeline-contract.test.mjs'
      - 'formal/TypedPipelineDirections*'
      - '.github/workflows/pipeline-contract-proposal.yml'
  pull_request:
    paths:
      - 'src/pipeline-contract.mjs'
      - 'contracts/pipeline/**'
      - 'tests/pipeline-contract.test.mjs'
      - 'formal/TypedPipelineDirections*'
      - '.github/workflows/pipeline-contract-proposal.yml'
permissions:
  contents: read
jobs:
  pipeline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Test typed contract, closed schemas and adversarial inputs
        run: node --test tests/pipeline-contract.test.mjs
      - name: Check bounded safe TLC model and required unsafe counterexample
        shell: bash
        working-directory: formal
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o tla2tools.jar https://github.com/zactionsz/tla-tools/releases/download/tla2tools-2026.08.11.125311/tla2tools.jar
          echo 'ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f  tla2tools.jar' | sha256sum -c -
          java -Xmx1g -cp tla2tools.jar tlc2.TLC -deadlock -workers 1 -config TypedPipelineDirections.cfg TypedPipelineDirections.tla
          if java -Xmx1g -cp tla2tools.jar tlc2.TLC -deadlock -workers 1 -config TypedPipelineDirectionsUnsafe.cfg TypedPipelineDirections.tla > unsafe.log 2>&1; then
            cat unsafe.log
            echo 'ERROR: early backward mutation escaped invariants' >&2
            exit 1
          fi
          grep -q ReverseRequiresFullForwardPath unsafe.log || { cat unsafe.log; exit 1; }
          echo 'Expected unsafe early-backward counterexample observed'
