name: AttoLang formal actor guest-refinement shape (NOT compiler parity)
on:
  push:
    branches: [main]
    paths:
      - 'formal/refinement-v1/**'
      - '.github/workflows/formal-actor-refinement-v1.yml'
  pull_request:
    paths:
      - 'formal/refinement-v1/**'
      - '.github/workflows/formal-actor-refinement-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Check candidate fixture evidence ledger
        run: node formal/refinement-v1/check-manifest.mjs
      - name: Bounded trace shape and negative mutations ONLY
        run: node --test formal/refinement-v1/replay.test.mjs formal/refinement-v1/manifest.test.mjs formal/refinement-v1/guest-trace-intake.test.mjs
