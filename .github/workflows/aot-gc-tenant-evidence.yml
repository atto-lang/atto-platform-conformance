name: AOT GC and tenant compiled-guest receipt structural gate
on:
  pull_request:
    paths:
      - 'contracts/aot-gc-tenant-evidence-v1.json'
      - 'fixtures/aot-tenant/**'
      - 'bin/verify_aot_gc_receipt.py'
      - 'bin/list-cases.mjs'
      - 'tests/conformance-planner.test.mjs'
      - 'tests/test_aot_gc_receipts.py'
      - '.github/workflows/aot-gc-tenant-evidence.yml'
  push:
    paths:
      - 'contracts/aot-gc-tenant-evidence-v1.json'
      - 'fixtures/aot-tenant/**'
      - 'bin/verify_aot_gc_receipt.py'
      - 'bin/list-cases.mjs'
      - 'tests/conformance-planner.test.mjs'
      - 'tests/test_aot_gc_receipts.py'
      - '.github/workflows/aot-gc-tenant-evidence.yml'
permissions:
  contents: read
jobs:
  structural-evidence-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
      - name: Validate compiler-source fixture Git blobs and baseline evidence registry
        run: python3 bin/verify_aot_gc_receipt.py
      - name: Validate 20 adversarial evidence controls
        run: python3 -m unittest discover -s tests -p test_aot_gc_receipts.py -v
      - name: Validate source-only conformance planning matrix
        run: node --test tests/conformance-planner.test.mjs
      - name: Evidence boundary
        run: echo 'STRUCTURAL_VALIDATOR_ONLY; no AttoLang compiler, guest, native image or GC executed'
