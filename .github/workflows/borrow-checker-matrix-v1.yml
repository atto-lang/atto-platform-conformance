name: Borrow-checker v1 static contract (Rust)
on:
  # Token-free exact-blob mirrors use a private carrier branch with this prefix.
  # Restrict execution to this fixture tree; never clone a private source org.
  push:
    branches:
      - 'ci/borrow-checker-v1-*'
    paths:
      - 'contracts/borrow-checker-v1.tsv'
      - 'contracts/borrow-checker-execution-v1.tsv'
      - 'contracts/borrow-checker-host-parity-v1.tsv'
      - 'fixtures/borrow-checker-v1/**'
      - 'docs/BORROW_CHECKER_CONFORMANCE_V1.md'
      - 'tests/borrow_checker_matrix_v1.rs'
      - 'bin/run_borrow_checker_matrix.rs'
      - 'bin/borrow_guest_exit.mjs'
      - 'tests/borrow_guest_exit_v1.test.mjs'
      - '.github/workflows/borrow-checker-matrix-v1.yml'
  pull_request:
    paths:
      - 'contracts/borrow-checker-v1.tsv'
      - 'contracts/borrow-checker-execution-v1.tsv'
      - 'contracts/borrow-checker-host-parity-v1.tsv'
      - 'fixtures/borrow-checker-v1/**'
      - 'docs/BORROW_CHECKER_CONFORMANCE_V1.md'
      - 'tests/borrow_checker_matrix_v1.rs'
      - 'bin/run_borrow_checker_matrix.rs'
      - 'bin/borrow_guest_exit.mjs'
      - 'tests/borrow_guest_exit_v1.test.mjs'
      - '.github/workflows/borrow-checker-matrix-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Node-only synthetic Wasm runner checks (not Atto guest conformance)
        run: node --test tests/borrow_guest_exit_v1.test.mjs
      - name: Install pinned Rust host toolchain (not a guest test)
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Static Rust versioned matrix validation — not guest execution
        run: |
          rustc +1.85.1 --version
          rustc +1.85.1 --edition=2021 --test tests/borrow_checker_matrix_v1.rs -o "$RUNNER_TEMP/borrow_checker_matrix_v1"
          "$RUNNER_TEMP/borrow_checker_matrix_v1" --nocapture
      - name: Rust-only executable gate unit tests — not compiled guest execution
        run: |
          rustc +1.85.1 --edition=2021 --test bin/run_borrow_checker_matrix.rs -o "$RUNNER_TEMP/borrow_checker_exec_v1_tests"
          "$RUNNER_TEMP/borrow_checker_exec_v1_tests" --nocapture
