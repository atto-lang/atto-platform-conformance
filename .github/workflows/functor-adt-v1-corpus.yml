name: Functor ADT v1 corpus integrity (source-free)
on:
  pull_request:
    paths:
      - 'contracts/functor-adt-v1.json'
      - 'contracts/functor-adt-v1.md'
      - 'fixtures/functor-adt-v1/**'
      - 'tests/functor-adt-v1-corpus.test.mjs'
      - '.github/workflows/functor-adt-v1-corpus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check exact source-backed blob identities (NOT guest proof)
        run: node --test tests/functor-adt-v1-corpus.test.mjs
