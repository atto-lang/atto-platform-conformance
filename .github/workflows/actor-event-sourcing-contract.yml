name: Atto event sourcing conformance (host-only registry)
on:
  pull_request:
    paths:
      - 'contracts/actor-event-sourcing-v1.json'
      - 'fixtures/actors/event_sourcing/**'
      - 'tests/actor-event-sourcing-contract.test.mjs'
      - '.github/workflows/actor-event-sourcing-contract.yml'
  push:
    paths:
      - 'contracts/actor-event-sourcing-v1.json'
      - 'fixtures/actors/event_sourcing/**'
      - 'tests/actor-event-sourcing-contract.test.mjs'
      - '.github/workflows/actor-event-sourcing-contract.yml'
permissions:
  contents: read
jobs:
  structural-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/actor-event-sourcing-contract.test.mjs
      - run: echo 'HOST_ONLY; no source compiler, durable journal, guest or SIGKILL replay executed'
