name: Actor registry v1 host reference model

on:
  pull_request:
    paths:
      - 'contracts/actor-registry-v1.json'
      - 'model/actor_registry_v1.py'
      - 'tests/test_actor_registry_v1.py'
      - '.github/workflows/actor-registry-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host_reference_only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute local actor registry model (NOT guest parity)
        run: python -m unittest discover -s tests -p 'test_actor_registry_v1.py' -v
