name: AOT backend identity and opaque-record hardening (source-only)
on:
  pull_request:
    paths:
      - 'lib/aot-execution-evidence-v2.mjs'
      - 'tests/aot-stage-evidence-negative-matrix.test.mjs'
      - 'tests/aot-backend-lane-identity-v2.test.mjs'
      - 'docs/AOT_EXECUTION_EVIDENCE_V2.md'
      - '.github/workflows/aot-backend-identity-source-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable submitted PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind source to exact submitted SHA and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "AOT_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "AOT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          for file in lib/aot-execution-evidence-v2.mjs tests/aot-stage-evidence-negative-matrix.test.mjs tests/aot-backend-lane-identity-v2.test.mjs; do
            expected="$(git rev-parse "HEAD:$file")"
            actual="$(git hash-object --no-filters "$file")"
            test "$expected" = "$actual"
            echo "SOURCE_GIT_BLOB=$file:$expected"
          done
      - name: Setup Node 22 for source-only unit checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run backend lane and hidden-metadata regression suites
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/aot-stage-evidence-negative-matrix.test.mjs tests/aot-backend-lane-identity-v2.test.mjs
          echo 'AOT_STRUCTURAL_TEST_ONLY=PASS; GUEST_EXECUTION=NOT_EXECUTED; RELEASE_QUALIFIED=false'
