name: Oreslang actor sync v1 contract inventory
on:
  pull_request:
    paths:
      - 'contracts/actor-sync-v1.json'
      - 'fixtures/actor-sync-v1/**'
      - 'bin/verify-actor-sync-v1.mjs'
      - 'bin/actor-sync-v1.test.mjs'
      - '.github/workflows/actor-sync-contract-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-sourcefree-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm source identity and run strict regression tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          node --version
          node --check bin/verify-actor-sync-v1.mjs
          node --check bin/actor-sync-v1.test.mjs
          node --test bin/actor-sync-v1.test.mjs
          node bin/verify-actor-sync-v1.mjs
          echo "SOURCEFREE_ACTOR_SYNC_INVENTORY_ONLY=$EXPECTED_SHA"
