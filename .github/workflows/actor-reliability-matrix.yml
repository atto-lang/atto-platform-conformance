name: Actor reliability matrix
on:
  pull_request:
    paths:
      - 'contracts/actor-reliability-v1.json'
      - 'tests/test_actor_reliability_matrix.py'
      - '.github/workflows/actor-reliability-matrix.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: python3 -m unittest tests.test_actor_reliability_matrix -v
