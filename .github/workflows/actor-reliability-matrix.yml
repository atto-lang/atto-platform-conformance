name: Actor reliability matrix
on:
  pull_request:
    paths:
      - 'contracts/actor-reliability-v1.json'
      - 'tests/test_actor_reliability_matrix.py'
      - '.github/workflows/actor-reliability-matrix.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_actor_reliability_matrix -v
