name: Spec / formatter conformance manifest integrity (host only)
on:
  push:
    paths:
      - 'contracts/specification-formatter-conformance-v1.json'
      - 'tests/specification-formatter-conformance-v1.test.mjs'
      - 'docs/specification-formatter-conformance-v1.md'
      - '.github/workflows/specification-formatter-conformance-v1.yml'
  pull_request:
    paths:
      - 'contracts/specification-formatter-conformance-v1.json'
      - 'tests/specification-formatter-conformance-v1.test.mjs'
      - 'docs/specification-formatter-conformance-v1.md'
      - '.github/workflows/specification-formatter-conformance-v1.yml'
permissions:
  contents: read
jobs:
  host-only-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact target SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Validate rule-linked case matrix (HOST_ONLY)
        run: |
          node --version
          node --test tests/specification-formatter-conformance-v1.test.mjs
      - name: Guard evidence scope
        run: |
          echo 'No Atto backend, parser or formatter was executed by this job.'
