name: Merge-wave advisory qualifier (source-owned)
on:
  push:
    branches:
      - main
      - feat/merge-wave-offline-qualification-20261106
      - audit/merge-wave-provenance-hardening-20261106
    paths:
      - .github/workflows/merge-wave-advisory-qualifier.yml
      - bin/merge-wave-qualifier.mjs
      - tools/merge-wave-qualifier.mjs
      - tests/merge-wave-qualifier.test.mjs
      - tests/merge-wave-qualifier-cli.test.mjs
      - tests/merge-wave-qualifier-e2e.test.mjs
      - tests/merge-wave-qualifier-calendar.test.mjs
  pull_request:
    paths:
      - .github/workflows/merge-wave-advisory-qualifier.yml
      - bin/merge-wave-qualifier.mjs
      - tools/merge-wave-qualifier.mjs
      - tests/merge-wave-qualifier.test.mjs
      - tests/merge-wave-qualifier-cli.test.mjs
      - tests/merge-wave-qualifier-e2e.test.mjs
      - tests/merge-wave-qualifier-calendar.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-merge-wave-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-runner-admission-canary:
    # No checkout, dependency downloads, source access, secrets, or marketplace actions.
    # A zero-step failure here means runner admission did not occur.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Prove a private-repository runner executed a shell step
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-platform-conformance"
          printf 'ATTO_PRIVATE_SOURCE_FREE_RUNNER_ALLOCATED\\n'
          printf 'ATTO_WORKFLOW_EVENT=%s\\n' "$GITHUB_EVENT_NAME"
  source-free-qualifier-regressions:
    needs: private-runner-admission-canary
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact event source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
      - name: Set up pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Execute all source-free qualifier tests (not guest parity)
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --check tools/merge-wave-qualifier.mjs
          node --check bin/merge-wave-qualifier.mjs
          node --test \
            tests/merge-wave-qualifier.test.mjs \
            tests/merge-wave-qualifier-cli.test.mjs \
            tests/merge-wave-qualifier-e2e.test.mjs \
            tests/merge-wave-qualifier-calendar.test.mjs
