name: Conformance harness unit checks (not compiler parity)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
      - name: Confirm mandatory real compiler gate cannot pass unconfigured
        run: |
          if node bin/conformance.mjs --backend=java --require; then
            echo "ERROR: unconfigured compiler unexpectedly counted as passing" >&2
            exit 1
          fi
