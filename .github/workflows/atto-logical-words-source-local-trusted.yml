# Manual-only source-local, source-free conformance tests. No PR/push
# trigger and no cross-organization source export.
name: AttoLang conformance logical words source-local trusted tests (NOT guest parity)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Exact current SHA of same-repo Conformance PR #658"
        required: true
        type: string
      expected_tree_sha:
        description: "Exact Git tree of that PR head"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: atto-conformance-logical-words-source-local-trusted
  cancel-in-progress: false

jobs:
  logical-word-conformance:
    if: github.repository == 'ores-truffle-oreslang/oreslang-platform-conformance' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, atto-conformance-trusted]
    timeout-minutes: 25
    steps:
      - name: Confirm exact current PR #658 head and trusted repo before checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree_sha }}
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ores-truffle-oreslang/oreslang-platform-conformance'
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test -n "${RUNNER_NAME:-}"
          python3 - <<'PY'
          import json, os, urllib.request
          repo = 'ores-truffle-oreslang/oreslang-platform-conformance'
          request = urllib.request.Request(
              'https://api.github.com/repos/' + repo + '/pulls/658',
              headers={
                  'Authorization': 'Bearer ' + os.environ['READ_ONLY_GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'atto-conformance-source-local',
              })
          with urllib.request.urlopen(request, timeout=20) as response:
              pull = json.load(response)
          head = (pull.get('head') or {})
          head_repo = head.get('repo') or {}
          if (pull.get('state') != 'open' or head.get('sha') != os.environ['EXPECTED_HEAD'] or
                  head_repo.get('full_name') != repo or head_repo.get('id') != 1413795502):
              raise SystemExit('DENIED: changed/foreign Conformance PR #658 head')
          print('ATTO_CONFORMANCE_EXACT_LIVE_PR_HEAD=' + head['sha'])
          PY

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false
          clean: true

      - name: Verify exact checkout, tree and no untracked source modifications
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          echo "ATTO_CONFORMANCE_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "ATTO_CONFORMANCE_SOURCE_TREE=$EXPECTED_TREE"
          echo "ATTO_CONFORMANCE_RUN_ATTEMPT=$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"

      - name: Execute real Node 22 logical-word manifest and mutation tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(4)'
          node --test tests/logical-word-operators-v1.test.mjs
          echo "ATTO_CONFORMANCE_LOGICAL_SOURCE_FREE=EXECUTED_NO_GUEST"

      - name: Execute complete repository Node test suite (no npm install)
        shell: bash
        run: |
          set -euo pipefail
          npm test
          echo "ATTO_CONFORMANCE_NODE_SUITE=EXECUTED_NO_COMPILER_GUEST"

      - name: Fence against PR head moving while tests ran
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          url='https://api.github.com/repos/ores-truffle-oreslang/oreslang-platform-conformance/pulls/658'
          req=urllib.request.Request(url, headers={
              'Authorization':'Bearer '+os.environ['READ_ONLY_GITHUB_TOKEN'],
              'Accept':'application/vnd.github+json',
              'User-Agent':'atto-conformance-recheck',
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              p=json.load(response)
          if p['head']['sha']!=os.environ['EXPECTED_HEAD']:
              raise SystemExit('DENIED: PR #658 head changed during Node suite')
          print('ATTO_CONFORMANCE_HEAD_STILL_CURRENT='+p['head']['sha'])
          print('ATTO_CONFORMANCE_SOURCE_EXPORT=NONE')
          print('ATTO_CONFORMANCE_GUEST_COMPILER_EVIDENCE=NOT_EXECUTED')
          PY
