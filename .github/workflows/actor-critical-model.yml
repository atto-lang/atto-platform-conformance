# Bounded host reference model, not guest-language/backend certification.
name: ACTOR_CRITICAL_BOUNDED_PASS (host-only)
on:
  pull_request:
    paths:
      - 'formal/actor_critical_model.py'
      - '.github/workflows/actor-critical-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-formal-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact triggering source tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
      - name: Explore every bounded transition and reject all four mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -B formal/actor_critical_model.py | tee model-evidence.txt
          grep -q '^ACTOR_CRITICAL_BOUNDED_PASS states=' model-evidence.txt
          test "$(grep -c '^MUTATION_REJECTED ' model-evidence.txt)" = 4
          grep -q '^HOST_MODEL_ONLY ' model-evidence.txt
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          echo 'MODEL_ONLY=PASS'
          echo 'ATTO_GUEST_BACKENDS=NOT_EXECUTED'
