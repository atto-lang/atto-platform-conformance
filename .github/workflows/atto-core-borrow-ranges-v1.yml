name: Atto core borrow range v1 reference only (NOT guest)
on:
  pull_request:
    paths:
      - 'contracts/atto-core-borrow-ranges-v1.json'
      - 'contracts/atto-core-borrow-source-ledger-v1.json'
      - 'tests/atto-core-borrow-ranges-v1.test.mjs'
      - '.github/workflows/atto-core-borrow-ranges-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-reference-no-native-loan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Match exact Git head and policy corpus blob
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD:contracts/atto-core-borrow-ranges-v1.json)" = \
            a6e35b7605c758559c9bdc094aacde152be7f2c0
      - name: Validate independent 64-vector reference with adversarial mutations
        run: node --test tests/atto-core-borrow-ranges-v1.test.mjs
      - name: Preserve non-compilation evidence boundary
        run: echo "ATTO_CORE_BORROW_GUEST=NOT_EXECUTED"
