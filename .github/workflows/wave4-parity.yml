name: Wave 4 actor/channel/IO reference tests (not compiler parity)
on:
  pull_request:
    paths:
      - 'parity/wave4/**'
      - '.github/workflows/wave4-parity.yml'
  push:
    branches:
      - 'feat/parity-wave4-actors-io-20261016'
    paths:
      - 'parity/wave4/**'
permissions:
  contents: read
jobs:
  wave4-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute reference-model and manifest unit tests
        run: node --test parity/wave4/tests/*.test.mjs
      - name: Verify six pinned Oreslang source candidates
        run: node parity/wave4/bin/manifest.mjs --validate
