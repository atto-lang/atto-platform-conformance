name: Wave 3 parity reference checks (not compiler parity)
on:
  pull_request:
    paths:
      - 'parity/wave3/**'
      - '.github/workflows/wave3-parity.yml'
  push:
    branches:
      - 'feat/parity-wave3-lifecycle-core-20261016'
    paths:
      - 'parity/wave3/**'
permissions:
  contents: read
jobs:
  reference-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact-source reference and manifest tests
        run: node --test parity/wave3/tests/*.test.mjs
      - name: Validate pinned fixture identities (not language parity)
        run: node parity/wave3/bin/wave3.mjs --validate
