name: Bounded actor CONTROL safety
on:
  pull_request:
    paths: ['formal/check_actor_control.mjs', 'formal/ACTOR_CONTROL.md', '.github/workflows/formal-actor-control.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actor-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node formal/check_actor_control.mjs
