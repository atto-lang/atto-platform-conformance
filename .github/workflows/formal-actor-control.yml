name: Bounded actor CONTROL safety
on:
  pull_request:
    paths:
      - 'formal/check_actor_control.mjs'
      - 'formal/adversarial_contract.test.mjs'
      - 'formal/ACTOR_CONTROL.md'
      - '.github/workflows/formal-actor-control.yml'
  push:
    branches: [main]
    paths:
      - 'formal/check_actor_control.mjs'
      - 'formal/adversarial_contract.test.mjs'
      - 'formal/ACTOR_CONTROL.md'
      - '.github/workflows/formal-actor-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actor-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: node formal/check_actor_control.mjs
      - name: Reject adversarial safety-model mutations
        run: node --test formal/adversarial_contract.test.mjs
