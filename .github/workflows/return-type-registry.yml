name: Return type source registry (NOT compiler)
on:
  push:
    paths:
      - 'contracts/return-type-inference-typeof-v1.json'
      - 'fixtures/return-types/**'
      - 'tests/test_return_type_inference_contract.py'
      - '.github/workflows/return-type-registry.yml'
  pull_request:
    paths:
      - 'contracts/return-type-inference-typeof-v1.json'
      - 'fixtures/return-types/**'
      - 'tests/test_return_type_inference_contract.py'
      - '.github/workflows/return-type-registry.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_return_type_inference_contract.py -v
