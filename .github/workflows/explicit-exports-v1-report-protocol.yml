name: explicit-exports-v1-report-protocol

on:
  push:
    branches:
      - "contracts/explicit-exports-v1-20261025"
  pull_request:
    paths:
      - "contracts/explicit-exports-v1.json"
      - "contracts/explicit-exports-v1.provenance.json"
      - "tools/verify-explicit-export-backend-report.mjs"
      - "tests/explicit_exports_v1_report_protocol_test.mjs"
      - ".github/workflows/explicit-exports-v1-report-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-free:
    name: source-free export report protocol
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require Node 20+
        run: |
          set -euo pipefail
          node --version
          test "$(node -p 'Number(process.versions.node.split(".")[0])')" -ge 20
      - name: Verify report protocol
        run: node tests/explicit_exports_v1_report_protocol_test.mjs
