name: TEMP private Wasmtime tenant fuel exact-blob test
on:
  push:
    branches:
      - ci/wasmtime-fuel-mirror-20261106
permissions:
  contents: read
jobs:
  native-wasmtime-tenant:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact temporary mirror commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked out branch SHA
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          echo "CARRIER_HEAD=$EXPECTED_HEAD"
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install Wasm32 C linker and LLVM
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Verify source Git blobs, compile Wasmtime and execute real AOT tenants
        run: bash ci/tenant-wasm/verify-mirror.sh
      - name: Explicit non-parity scope
        run: echo "SELECTED_BLOBS_TESTED_ONLY; original PR, whole source tree, and production tenant security NOT CERTIFIED"
