name: Pipeline stop bang alias source integrity
on:
  pull_request:
    paths:
      - 'fixtures/pipeline-stop-bang-v1/**'
      - 'contracts/pipeline-stop-bang-alias-v1.json'
      - 'tests/pipeline-stop-bang-alias-contract.test.mjs'
      - '.github/workflows/pipeline-stop-bang-alias-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/pipeline-stop-bang-alias-contract.test.mjs
