name: Actor GC profiles v1 source-only release guard
on:
  pull_request:
    paths: ['contracts/actor_gc_profiles_v1.json','scripts/verify_actor_gc_profiles_v1.rs','docs/ACTOR_GC_PROFILES_V1.md','.github/workflows/actor-gc-profiles-v1.yml']
  push:
    paths: ['contracts/actor_gc_profiles_v1.json','scripts/verify_actor_gc_profiles_v1.rs','docs/ACTOR_GC_PROFILES_V1.md','.github/workflows/actor-gc-profiles-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deny-unearned-gc-claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA and clean tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "RUN_ID=${{ github.run_id }}"
          echo "RUN_ATTEMPT=${{ github.run_attempt }}"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.99.1'
      - name: Compile and run dependency-free Rust policy admission
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings scripts/verify_actor_gc_profiles_v1.rs -o "$RUNNER_TEMP/verify_actor_gc_profiles_v1"
          "$RUNNER_TEMP/verify_actor_gc_profiles_v1"
      - name: Run Rust negative and adversarial mutations
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings --test scripts/verify_actor_gc_profiles_v1.rs -o "$RUNNER_TEMP/actor_gc_profile_tests"
          "$RUNNER_TEMP/actor_gc_profile_tests" --nocapture
      - name: Emit noncertifying source-policy receipt
        shell: bash
        run: |
          set -euo pipefail
          echo "source_sha=$(git rev-parse HEAD)"
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')"
          for path in contracts/actor_gc_profiles_v1.json scripts/verify_actor_gc_profiles_v1.rs docs/ACTOR_GC_PROFILES_V1.md; do
            echo "$path=$(git hash-object "$path")"
          done
          echo 'guest_runtime_executed=false'
          echo 'general_guest_zero_gc_certified=false'
          echo 'hard_realtime_certified=false'
