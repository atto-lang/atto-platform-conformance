name: Source-only 11-backend cross-contract parity inventory
on:
  pull_request:
    paths:
      - 'contracts/eleven-backend-parity-v1/**'
      - 'lib/eleven-backend-parity-v1.mjs'
      - 'tests/eleven-backend-parity-v1.test.mjs'
      - '.github/workflows/eleven-backend-parity-v1.yml'
      - 'docs/ELEVEN_BACKEND_PARITY_PROGRAM_V1.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA, tree and clean state
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain)"
          echo "PARITY_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "PARITY_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run source-only 11-backend 121-cell integrity and adversarial tests
        run: node --test tests/eleven-backend-parity-v1.test.mjs
      - name: Declare scope, never guest parity
        run: |
          echo 'ELEVEN_BACKEND_SOURCE_INVENTORY_ONLY=VALIDATED'
          echo 'BACKEND_COMPILER_EXECUTION=NOT_EXECUTED'
          echo 'GUEST_EXECUTION_PARITY=NOT_EXECUTED'
          echo 'PRIVATE_SOURCE_MIRROR=NONE'
