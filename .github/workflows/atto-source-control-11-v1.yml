name: Atto 11-backend source-control contract (source-only)
on:
  pull_request:
    paths:
      - 'contracts/atto-source-control-11-v1.json'
      - 'tests/atto-source-control-11-v1.test.mjs'
      - 'docs/ATTO_SOURCE_CONTROL_11_V1.md'
      - '.github/workflows/atto-source-control-11-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact submitted source tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute source-free registry and negative mutation tests
        run: node --test tests/atto-source-control-11-v1.test.mjs
