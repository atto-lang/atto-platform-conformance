name: Callable Tuple and Record apply (HOST_ONLY)
on:
  pull_request:
    paths:
      - 'conformance/callable-tuple-record-apply-v1.json'
      - 'tests/callable-tuple-record-apply-v1.test.mjs'
      - '.github/workflows/callable-tuple-record-apply-v1-host.yml'
permissions:
  contents: read
jobs:
  reference-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact checkout and run host-only model
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          node --test tests/callable-tuple-record-apply-v1.test.mjs
