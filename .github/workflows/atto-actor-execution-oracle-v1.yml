name: Atto actor execution oracle v1

on:
  pull_request:
    paths:
      - 'src/actor-execution-oracle-v1.mjs'
      - 'tests/actor-execution-oracle-v1.test.mjs'
      - 'contracts/v1/ATTO_BEAM_OTP_ACTOR_RUNTIME_V1.md'
      - '.github/workflows/atto-actor-execution-oracle-v1.yml'
  push:
    paths:
      - 'src/actor-execution-oracle-v1.mjs'
      - 'tests/actor-execution-oracle-v1.test.mjs'
      - '.github/workflows/atto-actor-execution-oracle-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-free-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute bounded Atto actor reference regressions
        run: node --test tests/actor-execution-oracle-v1.test.mjs
      - name: Report limits of evidence
        run: |
          echo 'SOURCE_FREE_ORACLE_ONLY'
          echo 'compiledGuestExecuted=false'
          echo 'nativePreemptionProven=false'
          echo 'nativeZeroCopyProven=false'
          echo 'fiveBackendParityCertified=false'
