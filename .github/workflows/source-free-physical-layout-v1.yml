name: AttoLang DOP physical-layout v1 host vectors (NON-GUEST)
on:
  pull_request:
    paths:
      - 'contracts/dop-physical-layout-v1.json'
      - 'verification/dop-physical-layout-v1.mjs'
      - 'tests/dop-physical-layout-v1.test.mjs'
      - '.github/workflows/source-free-physical-layout-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-layout-host-vectors:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify exact source HEAD and host-only golden bytes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          node --test tests/dop-physical-layout-v1.test.mjs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'DOP_PHYSICAL_LAYOUT_V1_HOST_ONLY_PASS, GUEST_NOT_EXECUTED'
