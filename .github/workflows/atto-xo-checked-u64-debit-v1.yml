name: Atto-XO unsigned debit source oracle
on:
  pull_request:
    paths:
      - 'contracts/atto-xo-checked-u64-debit-v1/**'
      - 'tests/atto-xo-checked-u64-debit-v1.test.mjs'
      - 'tests/fixed-width-integer-oracle.test.mjs'
      - 'tests/checked-u64-cross-candidates.test.mjs'
      - '.github/workflows/atto-xo-checked-u64-debit-v1.yml'
permissions:
  contents: read
jobs:
  source-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/atto-xo-checked-u64-debit-v1.test.mjs
      - name: Fixed-width host reference (not compiler parity)
        run: node --test tests/fixed-width-integer-oracle.test.mjs
      - name: Cross-candidate harness fail-closed controls (no guest execution)
        shell: bash
        run: |
          set -euo pipefail
          unset ATTO_U64_JS_SOURCE ATTO_U64_LLVM_SOURCE ATTO_U64_FORGE_SOURCE ATTO_U64_JAVA_SOURCE
          node --test --test-name-pattern='new independent boundary inventory' tests/checked-u64-cross-candidates.test.mjs
          if ATTO_U64_CROSS_REQUIRED=1 node --test tests/checked-u64-cross-candidates.test.mjs > missing.log 2>&1; then
            echo 'Missing source unexpectedly passed'
            exit 1
          fi
          grep -F 'JS: exact source required' missing.log
          if ATTO_U64_CROSS_REQUIRED=typo node --test tests/checked-u64-cross-candidates.test.mjs > invalid-mode.log 2>&1; then
            echo 'Invalid strict mode unexpectedly passed'
            exit 1
          fi
          grep -F 'ATTO_U64_CROSS_REQUIRED must be 0 or 1' invalid-mode.log
          if ATTO_U64_CROSS_REQUIRED=1 ATTO_U64_JS_SOURCE=tests/fixed-width-integer-oracle.test.mjs node --test tests/checked-u64-cross-candidates.test.mjs > altered.log 2>&1; then
            echo 'Altered source unexpectedly passed'
            exit 1
          fi
          grep -F '7726e7093bb66b10b88757004473c6fa38d8deed' altered.log
          echo 'Candidate guest execution: NOT_EXECUTED (no source staging)'
