name: FFI boundary v1 host-only reference and receipt validation
on:
  push:
    paths:
      - 'contracts/ffi-boundary-v1.json'
      - 'bin/verify_ffi_boundary_v1.py'
      - 'tests/test_ffi_boundary_v1.py'
      - '.github/workflows/ffi-boundary-v1.yml'
  pull_request:
    paths:
      - 'contracts/ffi-boundary-v1.json'
      - 'bin/verify_ffi_boundary_v1.py'
      - 'tests/test_ffi_boundary_v1.py'
      - '.github/workflows/ffi-boundary-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 bin/verify_ffi_boundary_v1.py
      - run: python3 -m unittest discover -s tests -p 'test_ffi_boundary_v1.py' -v
      - name: Verification scope
        run: echo 'HOST_ONLY_REFERENCE_AND_STRUCTURAL_RECEIPTS — no native foreign library or compiled AttoLang guest was executed'
