name: Pointer methods v2 target registry
on:
  pull_request:
    paths:
      - 'contracts/pointer-methods-v2.json'
      - 'tests/pointer_methods_v2.test.mjs'
      - '.github/workflows/pointer-methods-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-registry-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node tests/pointer_methods_v2.test.mjs
