name: AttoLang library profiles v1 (SOURCE CONTRACT ONLY)
on:
  pull_request:
    paths:
      - 'contracts/atto-library-profiles-v1.json'
      - 'lib/atto-library-profiles-v1.mjs'
      - 'lib/atto-library-run-evidence-v1.mjs'
      - 'tests/atto-library-profiles-v1.test.mjs'
      - 'tests/atto-library-run-evidence-v1.test.mjs'
      - 'tests/atto-library-runner-admission-v1.test.mjs'
      - 'tests/atto-library-workflow-admission-v1.test.mjs'
      - 'tests/atto-library-evidence-invariants-v1.test.mjs'
      - 'tests/atto-core-identity-stage1-v1.test.mjs'
      - 'tests/atto-core-numeric-stage2-v1.test.mjs'
      - 'tests/atto-core-source-bytes-v1.test.mjs'
      - 'fixtures/atto-library-source/v1/numeric.atto'
      - '.gitattributes'
      - 'fixtures/atto-library-source/v1/numeric-entry.atto'
      - 'evidence/atto-core-numeric-stage2-20261107.json'
      - 'fixtures/atto-library-source/v1/identity.atto'
      - 'fixtures/atto-library-source/v1/identity-entry.atto'
      - 'evidence/atto-core-identity-stage1-20261107.json'
      - 'evidence/atto-library-workflow-admission-20261107.json'
      - 'evidence/atto-library-source-only-runner-admission-20261107.json'
      - 'fixtures/atto-library-profiles/**'
      - 'docs/ATTO_LIBRARY_PROFILES_V1.md'
      - '.github/workflows/atto-library-profiles-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          printf 'HEAD=%s TREE=%s\n' "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')"
      - name: Execute policy-model and evidence-classifier tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test tests/atto-library-profiles-v1.test.mjs tests/atto-library-run-evidence-v1.test.mjs tests/atto-library-runner-admission-v1.test.mjs tests/atto-library-workflow-admission-v1.test.mjs tests/atto-library-evidence-invariants-v1.test.mjs tests/atto-core-identity-stage1-v1.test.mjs tests/atto-core-numeric-stage2-v1.test.mjs tests/atto-core-source-bytes-v1.test.mjs
      - name: Preserve evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'ATTO_LIBRARY_POLICY_TESTS=SOURCE_ONLY'
          echo 'COMPILER_BACKED_GUEST_EXECUTION=NOT_EXECUTED'
          echo 'FIVE_BACKEND_PARITY=NOT_EXECUTED'
