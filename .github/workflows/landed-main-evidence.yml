name: Landed-main release evidence (source-free only)
on:
  pull_request:
    paths:
      - 'tools/landed-main-evidence.mjs'
      - 'tests/landed-main-evidence.test.mjs'
      - 'bin/landed-main-evidence.mjs'
      - 'evidence/landed-main-20261106-wave.json'
      - 'evidence/landed-main-20261106-platform-wave.json'
      - 'tests/landed-main-20261106-platform-wave.test.mjs'
      - 'docs/landed-main-evidence.md'
      - '.github/workflows/landed-main-evidence.yml'
  push:
    paths:
      - 'tools/landed-main-evidence.mjs'
      - 'tests/landed-main-evidence.test.mjs'
      - 'bin/landed-main-evidence.mjs'
      - 'evidence/landed-main-20261106-wave.json'
      - 'evidence/landed-main-20261106-platform-wave.json'
      - 'tests/landed-main-20261106-platform-wave.test.mjs'
      - 'docs/landed-main-evidence.md'
      - '.github/workflows/landed-main-evidence.yml'
permissions:
  contents: read
jobs:
  source-free-postmerge-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          # No untracked, ignored or modified source shadows may qualify as exact-head tests.
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          git rev-parse HEAD^{tree} >/dev/null
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Execute postmerge evidence regressions
        run: node --test tests/landed-main-evidence.test.mjs tests/landed-main-20261106-platform-wave.test.mjs
      - name: Verify real sample ledger fails closed
        shell: bash
        run: |
          set -euo pipefail
          status=0
          node bin/landed-main-evidence.mjs evidence/landed-main-20261106-wave.json || status=$?
          test "$status" -eq 1
      - name: Ensure five latest landed PRs remain BLOCKED without independent evidence
        shell: bash
        run: |
          set -euo pipefail
          status=0
          node bin/landed-main-evidence.mjs evidence/landed-main-20261106-platform-wave.json || status=$?
          test "$status" -eq 1
