name: Actor tenant conformance structural gate
on:
  push:
    paths:
      - 'contracts/actor-tenant-conformance-v1.json'
      - 'bin/verify_actor_tenant_receipt.py'
      - 'tests/test_actor_tenant_receipts.py'
      - '.github/workflows/actor-tenant-conformance.yml'
  pull_request:
    paths:
      - 'contracts/actor-tenant-conformance-v1.json'
      - 'bin/verify_actor_tenant_receipt.py'
      - 'tests/test_actor_tenant_receipts.py'
      - '.github/workflows/actor-tenant-conformance.yml'
permissions:
  contents: read
jobs:
  structural-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR-head source tree and test blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          for path in bin/verify_actor_tenant_receipt.py tests/test_actor_tenant_receipts.py contracts/actor-tenant-conformance-v1.json; do
            test "$(git hash-object "$path")" = "$(git rev-parse "HEAD:$path")"
          done
          echo "EXACT_HEAD=$EXPECTED_HEAD"
          echo "EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify baseline manifest
        run: python3 bin/verify_actor_tenant_receipt.py
      - name: Test evidence rejection paths
        run: python3 -m unittest discover -s tests -p 'test_actor_tenant_receipts.py' -v
      - name: Evidence scope
        run: echo 'STRUCTURAL_ONLY - does not compile guest programs or test a real sandbox'
