name: "AttoLang bounded pubsub-generation formal model"
on:
  pull_request:
    paths:
      - 'formal/pubsub_generation.bounded.mjs'
      - 'formal/check_pubsub_generation_manifest.mjs'
      - 'formal/pubsub_generation_manifest_contract.test.mjs'
      - 'fixtures/actor-pubsub-generation-v1/manifest.json'
      - '.github/workflows/formal-pubsub-generation.yml'
  push:
    branches: [main]
    paths:
      - 'formal/pubsub_generation.bounded.mjs'
      - 'formal/check_pubsub_generation_manifest.mjs'
      - 'formal/pubsub_generation_manifest_contract.test.mjs'
      - 'fixtures/actor-pubsub-generation-v1/manifest.json'
      - '.github/workflows/formal-pubsub-generation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Exhaustive bounded model and negative controls
        run: |
          node formal/pubsub_generation.bounded.mjs
          node formal/check_pubsub_generation_manifest.mjs
          node --test formal/pubsub_generation_manifest_contract.test.mjs
