name: AttoLang static dispatch conformance (source only)
on:
  pull_request:
    paths:
      - "contracts/static-dispatch-aot-parity-v1.json"
      - "fixtures/static-dispatch-aot-v1/**"
      - "tools/verify-static-dispatch-aot-v1.mjs"
      - "test/static-dispatch-aot-parity-v1.test.mjs"
      - ".github/workflows/static-dispatch-aot-parity-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-dispatch-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact PR head checkout with no stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm head and root tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "DISPATCH_SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "DISPATCH_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Run source-only manifest and adversarial receipt checks
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test test/static-dispatch-aot-parity-v1.test.mjs
          echo "SOURCE_CONTRACT_ONLY=true" >> "$GITHUB_STEP_SUMMARY"
          echo "THIS_IS_NOT_A_COMPILED_GUEST_OR_AOT_PARITY_PASS=true" >> "$GITHUB_STEP_SUMMARY"
