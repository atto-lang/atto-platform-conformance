name: Source-local runner admission (no checkout)
on:
  workflow_dispatch:
permissions: {}
jobs:
  runner-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove runner allocated and shell executed
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner admission: shell executed\n'
          printf 'run=%s attempt=%s sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
          test -n "${RUNNER_NAME:-}"
          test -n "${RUNNER_OS:-}"
