name: Source-local runner admission (no checkout)
on:
  workflow_dispatch:
  push:
    branches:
      - ci/source-local-runner-admission-20261028
permissions: {}
jobs:
  runner-admission:
    if: github.repository == 'ores-truffle-oreslang/oreslang-platform-conformance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Prove source-local runner and meaningful shell execution
        shell: bash
        env:
          EXPECTED_REPOSITORY: ores-truffle-oreslang/oreslang-platform-conformance
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1 ;; esac
          test -n "${RUNNER_NAME:-}"
          test -n "${RUNNER_OS:-}"
          test -n "${GITHUB_RUN_ID:-}"
          test -n "${GITHUB_RUN_ATTEMPT:-}"
          test -n "${GITHUB_SHA:-}"
          printf 'RUNNER_ADMISSION_EXECUTED repo=%s run=%s attempt=%s sha=%s os=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$RUNNER_OS"
