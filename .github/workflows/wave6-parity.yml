name: Wave 6 platform and differential reference gates (not release certification)
on:
  pull_request:
    paths:
      - 'parity/wave6/**'
      - '.github/workflows/wave6-parity.yml'
  push:
    branches:
      - 'feat/parity-wave6-mobile-embedded-iot-desktop-cert-20261016'
    paths:
      - 'parity/wave6/**'
permissions:
  contents: read
jobs:
  wave6-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check source hashes and deliberately unverified profile inventory
        run: node parity/wave6/bin/check.mjs
      - name: Run hardened Node Ed25519/platform/differential reference tests
        run: node --test parity/wave6/tests/wave6.test.mjs
