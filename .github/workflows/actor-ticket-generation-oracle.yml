name: Actor dispatch generation ticket contract (Rust oracle)

on:
  pull_request:
    paths:
      - 'contracts/actor-dispatch-ticket-generation-v1.json'
      - 'tools/actor-dispatch-ticket-oracle/**'
      - '.github/workflows/actor-ticket-generation-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Rust formatter
        run: cargo fmt --manifest-path tools/actor-dispatch-ticket-oracle/Cargo.toml -- --check
      - name: Rust lints
        run: cargo clippy --manifest-path tools/actor-dispatch-ticket-oracle/Cargo.toml --all-targets -- -D warnings
      - name: Verify source-free 12-case reference oracle and mutation controls
        run: cargo test --manifest-path tools/actor-dispatch-ticket-oracle/Cargo.toml
