name: Select plan fixture SHA integrity (not backend execution)
on:
  pull_request:
    paths:
      - 'fixtures/select-plans/v1/**'
      - '.github/workflows/select-plan-fixture-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-integrity-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate six pinned source fixture blob SHAs
        run: node fixtures/select-plans/v1/verify-manifest.mjs
