name: M4 native dual-guest output receipt validator
on:
  pull_request:
    paths:
      - 'bin/check_m4_native_dual_logs.py'
      - 'tests/test_m4_native_dual_logs.py'
      - '.github/workflows/m4-native-dual-output.yml'
  push:
    paths:
      - 'bin/check_m4_native_dual_logs.py'
      - 'tests/test_m4_native_dual_logs.py'
      - '.github/workflows/m4-native-dual-output.yml'
permissions:
  contents: read
jobs:
  fail-closed-dual-output-structure:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --quiet HEAD --
      - name: Run all 19 untrusted evidence mutation tests
        run: |
          python3 -m unittest discover -s tests -p test_m4_native_dual_logs.py -v
      - name: Evidence boundary
        run: |
          echo 'OFFLINE_STRUCTURAL_OUTPUT_GATE_ONLY'
          echo 'The unit tests supply synthetic logs; actual GitHub executed-job provenance is separately checked'
