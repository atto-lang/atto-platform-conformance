name: Actor CONTROL priority formal model
on:
  push:
    paths:
      - 'formal/actor_control_model.py'
      - 'formal/ActorControlPriority.md'
      - 'tests/test_actor_control_formal.py'
      - '.github/workflows/actor-control-formal.yml'
  pull_request:
    paths:
      - 'formal/actor_control_model.py'
      - 'formal/ActorControlPriority.md'
      - 'tests/test_actor_control_formal.py'
      - '.github/workflows/actor-control-formal.yml'
permissions:
  contents: read
jobs:
  exhaustive-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Exhaustive interleavings and required mutation oracles
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_actor_control_formal.py -v
          python3 formal/actor_control_model.py --json
