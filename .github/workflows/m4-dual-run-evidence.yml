name: M4 dual native exact-run receipt structural integrity
on:
  pull_request:
    paths:
      - 'evidence/m4/dual-native-actor-observations-20261107.json'
      - 'tests/test_m4_run_record.py'
      - '.github/workflows/m4-dual-run-evidence.yml'
  push:
    paths:
      - 'evidence/m4/dual-native-actor-observations-20261107.json'
      - 'tests/test_m4_run_record.py'
      - '.github/workflows/m4-dual-run-evidence.yml'
permissions:
  contents: read
jobs:
  verify-claim-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out record commit
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git diff --quiet HEAD --
      - name: Test 13 schema and negative security-claim mutations
        run: python3 -m unittest discover -s tests -p test_m4_run_record.py -v
      - name: Explicit evidence scope
        run: |
          echo 'RECORD_STRUCTURE_VALID_ONLY; original source-backend GitHub Actions jobs were checked separately'
          echo 'No automatically authenticated cross-private-repository CI logs in this workflow'
