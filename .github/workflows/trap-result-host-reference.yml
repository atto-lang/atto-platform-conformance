name: Trap Result source integrity and host oracle (NOT guest parity)
on:
  pull_request:
    paths:
      - 'tests/trap_result_reference.mjs'
      - 'contracts/trap-result-v1.md'
      - 'contracts/trap-result-guest-v1.json'
      - 'fixtures/trap-result-v1/**'
      - 'tests/trap_result_source_cases.mjs'
      - 'tests/native_option_source_cases.mjs'
      - 'contracts/native-option-int-guest-v1.json'
      - 'fixtures/native-option-int-v1/**'
      - '.github/workflows/trap-result-host-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-host-oracle-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact reviewed source revision without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fail closed on unexpected Git head, tree, or unsafe fixture modes
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          [[ "$TREE" =~ ^[a-f0-9]{40}$ ]]
          echo "Exact source HEAD: $EXPECTED_HEAD"
          echo "Exact source tree: $TREE"
          while IFS= read -r -d '' fixture; do
            mode="$(git ls-files -s -- "$fixture" | cut -d' ' -f1)"
            test "$mode" = 100644 || { echo "Unsafe fixture mode: $fixture"; exit 1; }
          done < <(find fixtures/trap-result-v1 -type f -name '*.atto' -print0)
          echo "Result fixture file modes verified (blob pins checked by Node suite)"
      - name: Setup pinned Node 22 for source/host checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax-check source-only manifest and integrity test harness
        run: node --check tests/trap_result_source_cases.mjs
      - name: Execute complete 21 fixture / 11 backend SHA integrity and host-only oracle
        run: |
          node --test tests/trap_result_source_cases.mjs tests/native_option_source_cases.mjs tests/trap_result_reference.mjs
          echo 'TRAP_RESULT_SOURCE_BLOB_INTEGRITY=CHECKED'
          echo 'TRAP_RESULT_REFERENCE=HOST_ONLY'
          echo 'TRAP_RESULT_GUEST_PARITY=NOT_EXECUTED'
