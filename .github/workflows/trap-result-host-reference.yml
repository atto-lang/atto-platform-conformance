name: Trap Result host reference (not guest parity)
on:
  pull_request:
    paths:
      - 'tests/trap_result_reference.mjs'
      - 'contracts/trap-result-v1.md'
      - 'contracts/trap-result-guest-v1.json'
      - 'fixtures/trap-result-v1/**'
      - 'tests/trap_result_source_cases.mjs'
      - '.github/workflows/trap-result-host-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-reference-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run host-only reference oracle (never guest parity)
        run: |
          node --test tests/trap_result_reference.mjs tests/trap_result_source_cases.mjs
          echo 'TRAP_RESULT_REFERENCE=PASSED'
          echo 'TRAP_RESULT_GUEST_PARITY=NOT_EXECUTED'
