name: Modern linked-module source-contract integrity
on:
  push:
    paths:
      - 'fixtures/cranelift-linked-module-v1/**'
      - 'contracts/cranelift-modern-linked-module-v1.json'
      - 'tests/cranelift-modern-linked-module-v1.test.mjs'
      - '.github/workflows/cranelift-modern-linked-module-v1.yml'
  pull_request:
    paths:
      - 'fixtures/cranelift-linked-module-v1/**'
      - 'contracts/cranelift-modern-linked-module-v1.json'
      - 'tests/cranelift-modern-linked-module-v1.test.mjs'
      - '.github/workflows/cranelift-modern-linked-module-v1.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify original exact source head and unchanged checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          printf 'head=%s\ntree=%s\n' "$EXPECTED_SHA" "$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate source-only registry without guest-success claims
        run: |
          node --check tests/cranelift-modern-linked-module-v1.test.mjs
          node --test tests/cranelift-modern-linked-module-v1.test.mjs
