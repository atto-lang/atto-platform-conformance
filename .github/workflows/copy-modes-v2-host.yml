name: copy modes actor/AOT candidate fixture integrity (host only)
on:
  pull_request:
    paths:
      - 'contracts/copy-modes-v2.json'
      - 'fixtures/copy-modes-v2/**'
      - 'tests/test_copy_modes_v2.py'
      - '.github/workflows/copy-modes-v2-host.yml'
  push:
    paths:
      - 'contracts/copy-modes-v2.json'
      - 'fixtures/copy-modes-v2/**'
      - 'tests/test_copy_modes_v2.py'
      - '.github/workflows/copy-modes-v2-host.yml'
permissions:
  contents: read
jobs:
  host-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out source head then test fixture registry only
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m unittest discover -s tests -p test_copy_modes_v2.py -v
          echo "HOST_ONLY_NOT_BACKEND_GUEST_EXECUTION=$EXPECTED_SHA"
